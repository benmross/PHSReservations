	<body class="is-preload">

		<!-- Header -->
			<header id="header">
				<a href="index.html" class="title">PHS Reservations</a>
				<nav>
					<ul>
						<li><a href="index.html">Calendar</a></li>
						<li><a href="help.html" class="active">Help Page</a></li>
					</ul>
				</nav>
			</header>

		<!-- Wrapper -->
			<div id="wrapper">

				<!-- Main -->
					<section id="main" class="wrapper">
						<div class="inner">
							<h1 class="major">Reservation Calendar</h1>
							<span class="image fit"><img src="images/pic04.jpg" alt="" /></span>
						</div>
					</section>
				<table>
					<tr>
						<td>
							<label for="rooms">Choose a location:</label>

							<select name="rooms" id="rooms">
								<option value="SMCS Hub">SMCS Hub</option>
								<option value="Hum Hub">Humanities Hub</option>
								<option value="Glo Hub">Global Hub</option>
								<option value="Nest">ISP Hub</option>
								<option value="SMCS Collab">SMCS Collab</option>
								<option value="Hum Collab">Humanities Collab</option>
								<option value="Glo Collab">Global Collab</option>
								<option value="ISP Collab">ISP Collab</option>
							</select>
						</td>
						<td>
							<label for="days">Choose a date:</label>

							<select name="days" id="days">
								<option value="First day">First </option>
								<option value="Second day">Second</option>
								<option value="Third day">Third</option>
								<option value="Fourth day">Fourth</option>
								<option value="Fifth day">Fifth</option>
								<option value="Sixth day">Sixth</option>
								<option value="Seventh day">Seventh</option>
							</select>
						</td>
						<td>
							<label for="rooms">Choose a Time:</label>

							<select name="times" id="times">
								<option value="Before">Before</option>
								<option value="one">1st</option>
								<option value="two">2nd</option>
								<option value="three">3rd</option>
								<option value="four">4th</option>
								<option value="five">5th</option>
								<option value="six">6th</option>
								<option value="seven">7th</option>
								<option value="eight">8th</option>
								<option value="evening">After</option>
							</select>
						</td>
					</tr>
				</table>
